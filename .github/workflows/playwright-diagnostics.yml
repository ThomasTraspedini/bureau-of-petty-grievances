name: Playwright diagnostics

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Optional Playwright spec path (Chromium only)
        required: false
        type: string
      grep:
        description: Optional test-title regular expression
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPEC: ${{ inputs.spec }}
      GREP: ${{ inputs.grep }}

    steps:
      - name: Require a focused selection
        shell: bash
        run: |
          if [[ -z "${SPEC//[[:space:]]/}" && -z "${GREP//[[:space:]]/}" ]]; then
            echo "::error::Supply spec or grep (or both) to select focused Playwright tests."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Disable unrelated Google Chrome APT sources
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chrome_url='dl.google.com/linux/chrome-stable/deb'
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if grep -Fq "$chrome_url" "$source"; then
              echo "Disabling Chrome APT source: $source"
              sudo mv -- "$source" "$source.disabled"
            fi
          done
          if [[ -f /etc/apt/sources.list ]] && grep -Fq "$chrome_url" /etc/apt/sources.list; then
            echo "Disabling Chrome APT entries in: /etc/apt/sources.list"
            sudo sed -i '\|dl\.google\.com/linux/chrome-stable/deb|s|^|# Disabled Chrome source: |' /etc/apt/sources.list
          fi
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if grep -Fn "$chrome_url" "$source"; then
              echo "::error::Chrome repository remains in active APT source: $source"
              exit 1
            fi
          done
          if [[ -f /etc/apt/sources.list ]] && grep -v '^[[:space:]]*#' /etc/apt/sources.list | grep -Fn "$chrome_url"; then
            echo "::error::Chrome repository remains active in /etc/apt/sources.list"
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run focused Playwright tests
        shell: bash
        run: |
          args=(--project=chromium)
          if [[ -n "${GREP//[[:space:]]/}" ]]; then
            args+=(--grep "$GREP")
          fi
          if [[ -n "${SPEC//[[:space:]]/}" ]]; then
            args+=(-- "$SPEC")
          fi
          npx playwright test "${args[@]}"
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-failure-artifacts
          path: test-results/
