name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Disable unrelated Google Chrome APT sources
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chrome_url='dl.google.com/linux/chrome-stable/deb'
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if grep -Fq "$chrome_url" "$source"; then
              echo "Disabling Chrome APT source: $source"
              sudo mv -- "$source" "$source.disabled"
            fi
          done
          if [[ -f /etc/apt/sources.list ]] && grep -Fq "$chrome_url" /etc/apt/sources.list; then
            echo "Disabling Chrome APT entries in: /etc/apt/sources.list"
            sudo sed -i '\|dl\.google\.com/linux/chrome-stable/deb|s|^|# Disabled Chrome source: |' /etc/apt/sources.list
          fi
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if grep -Fn "$chrome_url" "$source"; then
              echo "::error::Chrome repository remains in active APT source: $source"
              exit 1
            fi
          done
          if [[ -f /etc/apt/sources.list ]] && grep -v '^[[:space:]]*#' /etc/apt/sources.list | grep -Fn "$chrome_url"; then
            echo "::error::Chrome repository remains active in /etc/apt/sources.list"
            exit 1
          fi
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: ./scripts/validate-repository.sh
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: test-results/
