name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Remove unrelated Google Chrome APT source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: ./scripts/validate-repository.sh
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: test-results/
